<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Add New User - Solely Shoes</title>
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
        
        <style>
            body {
                font-family: 'Outfit', sans-serif;
                background-color: #f8f9fa;
                background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
                min-height: 100vh;
            }

            .admin-sidebar {
                background-color: #0A1128;
                color: #fff;
                min-height: 100vh;
                padding-top: 2rem;
            }

            .nav-link {
                color: rgba(255,255,255,0.7) !important;
                padding: 0.8rem 1.5rem;
                transition: all 0.3s ease;
            }

            .nav-link:hover, .nav-link.active {
                color: #fff !important;
                background-color: rgba(255,255,255,0.1);
            }

            .dashboard-card {
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.05);
                padding: 3rem;
                margin-top: 2rem;
            }

            .form-control-premium {
                border-radius: 12px;
                padding: 0.8rem 1.2rem;
                border: 1px solid #dee2e6;
                transition: all 0.3s ease;
            }

            .form-control-premium:focus {
                border-color: #0A1128;
                box-shadow: 0 0 0 0.25rem rgba(10, 17, 40, 0.1);
            }

            .btn-premium {
                border-radius: 12px;
                padding: 0.8rem 2rem;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .btn-logout {
                border-radius: 10px;
                font-weight: 600;
            }
        </style>
    </h:head>

    <h:body>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-md-2 admin-sidebar d-none d-md-block">
                    <div class="text-center mb-5">
                        <img src="#{request.contextPath}/Photos/logo.png" height="60" width="140" style="filter: brightness(0) invert(1);"/>
                        <p class="mt-2 small text-uppercase fw-bold opacity-50">Admin Panel</p>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="Dashboard.xhtml"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="UserManagement.xhtml"><i class="bi bi-people me-2"></i> Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#"><i class="bi bi-box-seam me-2"></i> Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="ShoeManagement.xhtml"><i class="bi bi-shop me-2"></i> Shoes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="CategoryManagement.xhtml"><i class="bi bi-tags me-2"></i> Categories</a>
                        </li>
                    </ul>
                </div>

                <!-- Main Content -->
                <div class="col-md-10 py-4 px-5">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <a href="UserManagement.xhtml" class="text-decoration-none text-muted mb-2 d-inline-block">
                                <i class="bi bi-arrow-left"></i> Back to Users
                            </a>
                            <h2 class="fw-bold"><i class="bi bi-person-plus-fill me-2"></i> Add New User</h2>
                        </div>
                        <h:form>
                            <h:commandLink value="Logout" action="#{registerBeanCDI.logout()}" styleClass="btn btn-outline-danger btn-logout">
                                <i class="bi bi-box-arrow-right me-1"></i>
                            </h:commandLink>
                        </h:form>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="dashboard-card">
                                <h:form>
                                    <h:messages globalOnly="true" styleClass="alert alert-danger" />
                                    
                                    <div class="row g-4">
                                        <!-- Full Name -->
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Full Name</label>
                                            <h:inputText value="#{registerBeanCDI.name}" styleClass="form-control form-control-premium" required="true" requiredMessage="Name is required"/>
                                        </div>

                                        <!-- Email Address -->
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Email Address</label>
                                            <h:inputText value="#{registerBeanCDI.email}" styleClass="form-control form-control-premium" required="true" requiredMessage="Email is required"/>
                                        </div>

                                        <!-- Phone Number -->
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Phone Number</label>
                                            <h:inputText value="#{registerBeanCDI.phone}" styleClass="form-control form-control-premium" required="true" requiredMessage="Phone is required"/>
                                        </div>
                                        
                                        <!-- Role Dropdown -->
                                        <div class="col-md-6">
                                            <label class="form-label fw-semibold">Platform Role</label>
                                            <h:selectOneMenu value="#{registerBeanCDI.role}" styleClass="form-select form-control-premium">
                                                <f:selectItem itemValue="Client" itemLabel="Client" />
                                                <f:selectItem itemValue="Admin" itemLabel="Administrator" />
                                            </h:selectOneMenu>
                                        </div>

                                        <!-- Initial Password -->
                                        <div class="col-md-12">
                                            <label class="form-label fw-semibold">Initial Password</label>
                                            <h:inputSecret value="#{registerBeanCDI.password}" styleClass="form-control form-control-premium" required="true" requiredMessage="Password is required"/>
                                            <small class="text-muted">The user can change this later.</small>
                                        </div>

                                        <!-- Submit Button -->
                                        <div class="col-12 mt-5">
                                            <div class="d-flex gap-3 justify-content-end">
                                                <a href="UserManagement.xhtml" class="btn btn-light btn-premium">Cancel</a>
                                                <h:commandButton action="#{registerBeanCDI.addUserByAdmin()}" value="Create User" styleClass="btn btn-primary btn-premium px-5" />
                                            </div>
                                        </div>
                                    </div>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </h:body>
</html>
