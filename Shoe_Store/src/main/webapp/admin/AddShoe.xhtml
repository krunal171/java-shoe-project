<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Add New Shoe - Solely Shoes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&amp;display=swap" rel="stylesheet"/>
        
        <style>
            body {
                font-family: 'Outfit', sans-serif;
                background-color: #f8f9fa;
                background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
                min-height: 100vh;
            }

            .admin-sidebar {
                background-color: #0A1128;
                color: #fff;
                min-height: 100vh;
                padding-top: 2rem;
            }

            .nav-link {
                color: rgba(255,255,255,0.7) !important;
                padding: 0.8rem 1.5rem;
                transition: all 0.3s ease;
            }

            .nav-link:hover, .nav-link.active {
                color: #fff !important;
                background-color: rgba(255,255,255,0.1);
            }

            .dashboard-card {
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.05);
                padding: 2rem;
                margin-top: 2rem;
            }

            .btn-premium {
                border-radius: 10px;
                padding: 0.6rem 1.5rem;
                font-weight: 600;
                transition: all 0.3s ease;
            }

            .form-control-premium {
                border-radius: 10px;
                padding: 0.75rem 1rem;
                border: 1px solid #dee2e6;
            }

            .form-control-premium:focus {
                box-shadow: 0 0 0 0.25rem rgba(10, 17, 40, 0.1);
                border-color: #0A1128;
            }

            .checkbox-scroll-box {
                height: 150px;
                overflow-y: auto;
                border: 1px solid #dee2e6;
                border-radius: 10px;
                padding: 1rem;
                background-color: #fff;
            }

            .checkbox-scroll-box table {
                width: 100%;
            }

            .checkbox-scroll-box label {
                margin-left: 10px;
                font-weight: 500;
                cursor: pointer;
            }
        </style>
    </h:head>

    <h:body>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-md-2 admin-sidebar d-none d-md-block">
                    <div class="text-center mb-5">
                        <img src="#{request.contextPath}/Photos/logo.png" height="60" width="140" style="filter: brightness(0) invert(1);"/>
                        <p class="mt-2 small text-uppercase fw-bold opacity-50">Admin Panel</p>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="Dashboard.xhtml"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="UserManagement.xhtml"><i class="bi bi-people me-2"></i> Users</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#"><i class="bi bi-box-seam me-2"></i> Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="ShoeManagement.xhtml"><i class="bi bi-shop me-2"></i> Shoes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="CategoryManagement.xhtml"><i class="bi bi-tags me-2"></i> Categories</a>
                        </li>
                    </ul>
                </div>

                <!-- Main Content -->
                <div class="col-md-10 py-4 px-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="d-flex align-items-center">
                            <a href="ShoeManagement.xhtml" class="btn btn-outline-secondary btn-premium me-3"><i class="bi bi-arrow-left"></i> Back</a>
                            <h2 class="fw-bold mb-0"> Add Shoe</h2>
                        </div>
                        <h:form>
                            <h:commandLink value="Logout" action="#{registerBeanCDI.logout()}" styleClass="btn btn-outline-danger btn-logout">
                                <i class="bi bi-box-arrow-right me-1"></i>
                            </h:commandLink>
                        </h:form>
                    </div>

                    <div class="row justify-content-center">
                        <div class="col-lg-8">
                            <div class="dashboard-card">
                                <h4 class="fw-bold mb-4">Enter Shoe Details</h4>
                                <h:messages globalOnly="false" styleClass="alert alert-danger" />
                                <h:form id="addShoeForm" styleClass="row g-3" enctype="multipart/form-data">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Shoe Name</label>
                                        <h:inputText value="#{shoeBeanCDI.shoeName}" styleClass="form-control form-control-premium" 
                                                     placeholder="e.g. Air Max 270" required="true" requiredMessage="Shoe Name is required!"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Brand</label>
                                        <h:selectOneMenu value="#{shoeBeanCDI.brand}" styleClass="form-select form-control-premium" 
                                                         required="true" requiredMessage="Please select a Brand!">
                                            <f:selectItem itemLabel="Select Brand" itemValue=""/>
                                            <f:selectItems value="#{shoeBeanCDI.allBrands}" var="b" itemLabel="#{b.brandName}" itemValue="#{b.brandId}"/>
                                        </h:selectOneMenu>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Category</label>
                                        <h:selectOneMenu value="#{shoeBeanCDI.category}" styleClass="form-select form-control-premium"
                                                         required="true" requiredMessage="Please select a Category!">
                                            <f:selectItem itemLabel="Select Category" itemValue=""/>
                                            <f:selectItems value="#{shoeBeanCDI.allCategories}" var="c" itemLabel="#{c.categoryName}" itemValue="#{c.categoryId}"/>
                                        </h:selectOneMenu>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Available Colors (Check all that apply)</label>
                                        <div class="checkbox-scroll-box">
                                            <h:selectManyCheckbox value="#{shoeBeanCDI.selectedColors}" layout="pageDirection">
                                                <f:selectItems value="#{shoeBeanCDI.allColors}" var="clr" itemLabel="#{clr.colorName}" itemValue="#{clr.colorId.toString()}"/>
                                            </h:selectManyCheckbox>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Price (₹)</label>
                                        <h:inputText value="#{shoeBeanCDI.price}" styleClass="form-control form-control-premium" 
                                                     placeholder="0.00" required="true" requiredMessage="Price is required!"/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Inventory Status</label>
                                        <h:selectOneMenu value="#{shoeBeanCDI.status}" styleClass="form-select form-control-premium">
                                            <f:selectItem itemLabel="Available" itemValue="Available"/>
                                            <f:selectItem itemLabel="Limited" itemValue="Limited"/>
                                            <f:selectItem itemLabel="Not Available" itemValue="Not Available"/>
                                        </h:selectOneMenu>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Select Image from Device</label>
                                        <h:inputFile value="#{shoeBeanCDI.imageFile}" styleClass="form-control form-control-premium" required="true" requiredMessage="Please select an image file!"/>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Description</label>
                                        <h:inputTextarea value="#{shoeBeanCDI.description}" styleClass="form-control form-control-premium" rows="3"/>
                                    </div>
                                    <div class="col-12 mt-4 text-end">
                                        <h:commandButton value="Add Shoe to Inventory" action="#{shoeBeanCDI.addShoe()}" styleClass="btn btn-primary btn-premium px-5"/>
                                    </div>
                                </h:form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </h:body>
</html>
